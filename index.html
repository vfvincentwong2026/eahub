<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EAHub · HoloSophy 知识库</title>
  <meta name="description" content="EAHub — HoloSophy 开源知识库的极简展示层">
  <meta name="eahub-api" content="https://mcp.eastastar.com">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script defer src="vendor/force-graph.min.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="cosmos" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" title="EAHub · HoloSophy 知识库">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span class="brand-name">EAHub</span>
        <span class="brand-dot" aria-hidden="true">·</span>
        <span class="brand-sub">HoloSophy 知识库</span>
      </a>
      <div class="header-tools">
        <label class="search-box" for="search-input">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
          <input id="search-input" type="search" placeholder="搜索知识库… Search" autocomplete="off" aria-label="搜索知识库">
        </label>
        <a class="github-link" href="https://github.com/vfvincentwong2026/eahub" target="_blank" rel="noopener" aria-label="GitHub 仓库" title="GitHub: eahub">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"></path>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <div class="controls-bar">
    <nav class="chips-bar" id="category-chips" aria-label="分类筛选"></nav>
    <div class="view-switch" role="group" aria-label="视图切换">
      <button class="view-btn active" type="button" data-view="list">列表</button>
      <button class="view-btn" type="button" data-view="graph">图谱</button>
    </div>
  </div>

  <main class="container">
    <p class="status-line" id="status-line" role="status">正在连接知识库…</p>
    <section class="card-grid" id="card-grid" aria-live="polite"></section>
    <section class="graph-wrap" id="graph-wrap" hidden aria-label="知识图谱">
      <div id="graph-container"></div>
    </section>
  </main>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <article class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <div class="modal-head-text">
          <span class="badge" id="modal-category"></span>
          <h2 id="modal-title"></h2>
          <p class="modal-cn" id="modal-cn" hidden></p>
          <p class="modal-tags" id="modal-tags"></p>
        </div>
        <button class="modal-close" id="modal-close" type="button" aria-label="关闭弹层">×</button>
      </header>
      <div class="modal-body markdown-body" id="modal-body"></div>
    </article>
  </div>

  <footer class="site-footer">
    <nav class="footer-links" aria-label="相关仓库">
      <a href="https://github.com/vfvincentwong2026/holosophy" target="_blank" rel="noopener">holosophy</a>
      <span class="footer-sep" aria-hidden="true">｜</span>
      <a href="https://github.com/vfvincentwong2026/holosophy-mcp" target="_blank" rel="noopener">holosophy-mcp</a>
      <span class="footer-sep" aria-hidden="true">｜</span>
      <a href="https://github.com/vfvincentwong2026/eahub" target="_blank" rel="noopener">eahub</a>
    </nav>
    <p class="footer-note">Fully Open Source · MIT License</p>
  </footer>
</body>
</html>
